<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- Tailwind + DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Style -->
    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>

</head>

<body>

    <!-- navbar section -->
    <section class="bg-base-100 shadow-sm mb-[60px]">
        <div class="flex justify-between navbar w-11/12 mx-auto">
            <div class="flex justify-between items-center gap-3">
                <img class="w-[50px]" src="./assets/github-logo.png" alt="">
                <h2 class="font-semibold text-[24px] text-[#1F2937]">Github Issues Tracker</h2>
            </div>
            <div class="">
                <input type="text" placeholder="Search issues..." class="input input-bordered w-24 md:w-auto" />
                <button class="btn btn-primary"><i class="fa-solid fa-plus"></i>New Issues</button>
            </div>
        </div>
    </section>

    <section class="bg-base-100 mb-[16px] p-[24px] w-11/12 mx-auto shadow-[0_5px_20px_rgba(0,0,0,0.08)] rounded-xl">
        <div class="flex gap-3">
            <button id="btn-all" onclick="loadCards() , btnActive('btn-all')" class="btn btn-outline btn-primary btn-active">All</button>
            <button onclick="btnActive('btn-open')" id="btn-open" class="btn btn-outline btn-primary">Open</button>
            <button onclick="btnActive('btn-closed')" id="btn-closed" class="btn btn-outline btn-primary">Closed</button>
        </div>
    </section>


    <section class="bg-base-100 w-11/12 mx-auto shadow-[0_5px_20px_rgba(0,0,0,0.08)] rounded-xl ">
        <section class="flex justify-between items-center p-[24px]">
            <div class="flex gap-3">
                <img class="w-[50px]" src="./assets/Aperture.png" alt="">
                <div class="flex flex-col">
                    <h2 class="font-semibold text-[20px]"><span id="total-card">0 </span>   Issues</h2>
                    <p class="text-[#64748B]">Track and manage your project issues</p>
                </div>
            </div>

            <div class="flex gap-4">
                <div class="">
                    <span class="text-[#00A96E]"><i class="fa-solid fa-circle"></i></span>
                    <span>Open</span>
                </div>
                <div class="">
                    <span class="text-[#A855F7]"><i class="fa-solid fa-circle"></i></span>
                    <span>Close</span>
                </div>
            </div>
        </section>

        <section class="p-[24px] border-t-gray-300">

            <div id="card-container" class="grid grid-cols-4 p-[16px] gap-4 ">
                
            </div>

        </section>
    </section>

    <script src="./Script/home.js"></script>
</body>

</html>
